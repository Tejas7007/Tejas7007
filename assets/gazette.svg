<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 437" width="1000" height="437" role="img" aria-label="The front page of the Gotham Gazette, set flat and square to the frame as a page of type and rules on a steel-grey sheet, with no photograph. The masthead THE GOTHAM GAZETTE runs across the top, with Late City Edition set small beside it, over a heavy rule. The lead headline reads &quot;EMNLP Findings 2026 Copying Before Suppression enters the public record&quot;. Also on file: Google Summer of Code final report released; ICML interpretability work released. Below a cut-off rule at the foot: Last updated 9 October. Nine public repositories on the record.">
<title>The Gotham Gazette — the public record of what has opened</title>
<style>
  @font-face{font-family:'Archivo';font-weight:800;font-display:swap;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Martian Mono';font-weight:400;font-display:swap;src:url(data:font/woff2;base64,) format('woff2')}
  text { font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .mono { font-family: 'Martian Mono', ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
</style>
<rect width="1000" height="437" fill="#717a81"/>
<rect x="60" y="24" width="880" height="1.6" fill="#04070b"/>
<text x="60" y="82" font-size="44" font-weight="800" fill="#04070b">THE GOTHAM GAZETTE</text>
<text class="mono" x="940" y="64" font-size="18" text-anchor="end" fill="#04070b">LATE CITY EDITION</text>
<rect x="60" y="102" width="880" height="4" fill="#04070b"/>
<text x="60" y="156" font-size="34" font-weight="800" fill="#04070b">EMNLP Findings 2026 Copying Before Suppression enters</text>
<text x="60" y="195" font-size="34" font-weight="800" fill="#04070b">the public record</text>
<rect x="60" y="229" width="880" height="1.6" fill="#04070b"/>
<text class="mono" x="60" y="252.6" font-size="18" fill="#04070b">ALSO ON FILE</text>
<text x="60" y="286.6" font-size="24" font-weight="800" fill="#04070b">Google Summer of Code final report released</text>
<rect x="60" y="298.6" width="880" height="1.2" fill="#434a4f"/>
<text x="60" y="329.8" font-size="24" font-weight="800" fill="#04070b">ICML interpretability work released</text>
<rect x="60" y="363.8" width="880" height="3" fill="#04070b"/>
<text class="mono" x="60" y="390.8" font-size="18" fill="#04070b">LAST UPDATED 9 OCTOBER</text>
<text class="mono" x="60" y="412.8" font-size="18" fill="#04070b">NINE PUBLIC REPOSITORIES ON THE RECORD</text>
<rect x=".5" y=".5" width="999" height="436" fill="none" stroke="#1f262d"/>
</svg>
