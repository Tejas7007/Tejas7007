<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 499" width="1000" height="499" role="img" aria-label="The front page of the Gotham Gazette, set flat and square to the frame as a page of type and rules on a steel-grey sheet, with no photograph. The masthead THE GOTHAM GAZETTE runs across the top, with Late City Edition set small beside it, over a heavy rule. The lead headline reads &quot;GPT2 Small from Scratch enters the public record&quot;. Under it: &quot;GPT-2 Small trained from scratch on 10B FineWeb tokens, with distributed PyTorch training, held-out evaluations, and detailed training visualizations.&quot; Also on file: NeurIPS 2026 TCCML Sensor Diagnosis enters the public record; EMNLP Findings 2026 Copying Before Suppression enters the public record. Below a cut-off rule at the foot: Last updated 30 October. 11 public repositories on the record.">
<title>The Gotham Gazette — the public record of what has opened</title>
<style>
  @font-face{font-family:'Archivo';font-weight:800;font-display:swap;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Martian Mono';font-weight:400;font-display:swap;src:url(data:font/woff2;base64,) format('woff2')}
  text { font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .mono { font-family: 'Martian Mono', ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
</style>
<rect width="1000" height="499" fill="#717a81"/>
<rect x="60" y="24" width="880" height="1.6" fill="#04070b"/>
<text x="60" y="82" font-size="44" font-weight="800" fill="#04070b">THE GOTHAM GAZETTE</text>
<text class="mono" x="940" y="64" font-size="18" text-anchor="end" fill="#04070b">LATE CITY EDITION</text>
<rect x="60" y="102" width="880" height="4" fill="#04070b"/>
<text x="60" y="156" font-size="34" font-weight="800" fill="#04070b">GPT2 Small from Scratch enters the public record</text>
<rect x="60" y="176" width="190" height="3" fill="#04070b"/>
<text class="mono" x="60" y="205" font-size="20" fill="#04070b">GPT-2 Small trained from scratch on 10B FineWeb tokens, with</text>
<text class="mono" x="60" y="231" font-size="20" fill="#04070b">distributed PyTorch training, held-out evaluations, and</text>
<text class="mono" x="60" y="257" font-size="20" fill="#04070b">detailed training visualizations.</text>
<rect x="60" y="291" width="880" height="1.6" fill="#04070b"/>
<text class="mono" x="60" y="314.6" font-size="18" fill="#04070b">ALSO ON FILE</text>
<text x="60" y="348.6" font-size="24" font-weight="800" fill="#04070b">NeurIPS 2026 TCCML Sensor Diagnosis enters the public record</text>
<rect x="60" y="360.6" width="880" height="1.2" fill="#434a4f"/>
<text x="60" y="391.8" font-size="24" font-weight="800" fill="#04070b">EMNLP Findings 2026 Copying Before Suppression enters the public record</text>
<rect x="60" y="425.8" width="880" height="3" fill="#04070b"/>
<text class="mono" x="60" y="452.8" font-size="18" fill="#04070b">LAST UPDATED 30 OCTOBER</text>
<text class="mono" x="60" y="474.8" font-size="18" fill="#04070b">11 PUBLIC REPOSITORIES ON THE RECORD</text>
<rect x=".5" y=".5" width="999" height="498" fill="none" stroke="#1f262d"/>
</svg>
