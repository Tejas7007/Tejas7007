<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 874 278" width="874" height="278" role="img" aria-label="Surveillance grid. A dark instrument panel headed with the window it covers, 10 OCT 2025 to 10 OCT 2026, Under a rail of month names runs a calendar of the whole year, one small square a night, 53 columns of 7, shaded through five cold steps from a barely lit square for a quiet night to a pale one for a heavy night, with no square at all on a night when nothing happened. One square is red: the busiest night of the year. The heaviest month is DEC. Three figures are printed beneath the field: 5,720 events, a typical night of 12, and a busiest night of 88 beside a small red key that points back at that square. The year holds 365 active nights. At the right of the same line a key of five squares runs QUIET to HEAVY.">
<title>Surveillance Grid · 5,720 events, typical night 12</title>
<style>
  @font-face{font-family:'Martian Mono';font-weight:400;font-display:swap;src:url(data:font/woff2;base64,) format('woff2')}
  /* Every string in this panel is a label or a number, so the mono is the
     default here rather than a class. */
  text { font-family: 'Martian Mono', ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  /* The beam crosses the plate and then the panel sits still for nine
     seconds. A beam that slides across at constant speed forever is the
     drifting decoration the rest of the profile avoids. It rests OFF the
     frame rather than on it: a flat wash parked over the calendar would sit
     on top of the encoding for nine seconds out of twelve. */
  .scan { animation: sweep 12s cubic-bezier(.5,0,.5,1) infinite; animation-delay: -4.2s; }
  @keyframes sweep { 0% { transform: skewX(12.57deg) translateX(-145px) } 22%, 100% { transform: skewX(12.57deg) translateX(1019px) } }
  /* Eleven seconds, not five: on a page nobody scrolls, a held loop holds for
     at least nine of them. Same period as the mark's rim heat, so the two
     panels breathe on one clock instead of two that nearly agree. */
  .h0, .h1, .h2, .h3 { animation: settle 11s steps(1) infinite; }
  .h1 { animation-delay: -2.7s } .h2 { animation-delay: -5.4s } .h3 { animation-delay: -8.1s }
  @media (prefers-reduced-motion: reduce) { .scan, .h0, .h1, .h2, .h3 { animation: none } }
</style>
